name: Format tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - name: Check all four formats
        shell: cmd
        run: tests\run-tests.bat
